name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Portable unit + type + property + balance checks across the supported matrix.
  # The `test` script names every suite explicitly (no shell glob), so it runs identically
  # on cmd.exe (Windows) and on Node's test runner (no glob support before Node 21).
  test:
    name: test (node ${{ matrix.node }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:types
      - run: npm run fuzz
      - run: npm run balance

  # `engines` claims Node >=18, but the `test` matrix above starts at 20 (the dev tooling --
  # @zakkster/lite-leak / lite-gc-profiler -- needs >=20, so torture/test:perf cannot run on 18).
  # This job actually TESTS the >=18 floor: it runs ONLY `npm test`, whose unit suites depend
  # solely on node:test + the zero-dep Pick.js/Pool.js and need none of the Node-20 tooling.
  # No `npm ci`: installing the devDependencies on 18 only produces EBADENGINE noise (lite-leak,
  # lite-cleanup need >=20), and running with NO node_modules proves the suites are dependency-free.
  test-node18:
    name: test-node18 (engines floor -- unit suites only, no install)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - run: npm test

  # The heavy, timing-sensitive gates on one pinned runner. test:perf pins its own semi-space
  # flags in the script; torture needs --expose-gc (also in the script).
  gates:
    name: gates (node 22 / ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # S6: shipped code (Pick/Pool .js/.d.ts) + the soak's invariant oracle must match their committed
      # sha256 pins -- a change to them must re-pin (npm run parity:update) in the same commit.
      - run: npm run parity
      - run: npm run torture
      - run: npm run test:perf
      # 1.1.0 B6: the same gate with V8 inlining OFF -- the worst case, a caller V8 will not inline into. Every
      # lane must still be 0 B/op (research/1.1.0-buffer-apis.md: the From methods + the self-contained PRNG).
      - run: npm run test:perf:noinline
      - run: npm run bench:verify
      - name: tarball is exactly the 11 whitelisted files
        run: |
          node -e '
            const cp = require("child_process");
            const out = cp.execSync("npm pack --dry-run --json").toString();
            const files = JSON.parse(out)[0].files.map((f) => f.path).sort();
            const expected = ["CHANGELOG.md","GUIDE.md","LICENSE","Pick.d.ts","Pick.js","Pool.d.ts","Pool.js","README.md","RECIPES.md","llms.txt","package.json"].sort();
            const got = JSON.stringify(files), exp = JSON.stringify(expected);
            if (got !== exp) { console.error("tarball file set mismatch\ngot:      " + got + "\nexpected: " + exp); process.exit(1); }
            console.log("tarball OK: exactly " + files.length + " files");
          '

  # The capstone's headless kernel (pickEcosystem/live, research/capstone-P1-spec.md F8): its own package.json
  # pins the published bricks (lite-pick 1.1.0, lite-worker-pool 1.1.0, the di-* line); `npm test` runs the
  # gates over virtual workers (deterministic) plus one suite against THIS working tree's Pick.js / Pool.js, so a
  # kernel change cannot silently break the capstone; `npm run smoke` is ~20 s over real worker_threads with
  # every fault once (a lower rate for the 2-core runner); `npm run browser-smoke` serves the P3 page and drives
  # it in the runner's Chrome (headless, over the DevTools protocol) against the pinned esm.sh modules.
  capstone:
    name: capstone (pickEcosystem/live, node 22)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pickEcosystem/live
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pickEcosystem/live/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run smoke
        env:
          SMOKE_RATE: '600'
      - run: npm run browser-smoke

  # Compile a real consumer against the PACKED tarball (not the working tree) so the exports
  # map and the typesVersions /pool mapping are exercised. ubuntu is deliberate: its filesystem
  # is CASE-SENSITIVE, so `@zakkster/lite-pick/pool` -> Pool.d.ts only resolves via typesVersions
  # (on a case-insensitive FS `pool` would match `Pool.d.ts` and hide a broken mapping).
  types-compat:
    name: types-compat (ubuntu, typescript@5)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: pack the tarball
        run: npm pack
      - name: install the packed tarball into the consumer fixture
        working-directory: test/types/consumer
        run: npm install "$GITHUB_WORKSPACE"/zakkster-lite-pick-*.tgz
      - name: compile consumer under moduleResolution node16
        working-directory: test/types/consumer
        run: npx -y -p typescript@5 tsc -p tsconfig.node16.json
      - name: compile consumer under moduleResolution node10
        working-directory: test/types/consumer
        run: npx -y -p typescript@5 tsc -p tsconfig.node10.json
      - name: compile consumer under moduleResolution bundler
        working-directory: test/types/consumer
        run: npx -y -p typescript@5 tsc -p tsconfig.bundler.json
      - name: compile consumer under lib ES2022 only (no DOM, no @types/node)
        working-directory: test/types/consumer
        run: npx -y -p typescript@5 tsc -p tsconfig.es2022.json
