name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Portable unit + type + property + balance checks across the supported matrix.
  # The `test` script names every suite explicitly (no shell glob), so it runs identically
  # on cmd.exe (Windows) and on Node's test runner (no glob support before Node 21).
  test:
    name: test (node ${{ matrix.node }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # test/SoakAB.test.js teeth anchors `git show 2a08567:Pick.js` (the 1.1.0 kernel)
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:types
      - run: npm run fuzz
      - run: npm run balance

  # `engines` claims Node >=18, but the `test` matrix above starts at 20 (the dev tooling --
  # @zakkster/lite-leak / lite-gc-profiler -- needs >=20, so torture/test:perf cannot run on 18).
  # This job actually TESTS the >=18 floor: it runs ONLY `npm test`, whose unit suites depend
  # solely on node:test + the zero-dep Pick.js/Pool.js and need none of the Node-20 tooling.
  # No `npm ci`: installing the devDependencies on 18 only produces EBADENGINE noise (lite-leak,
  # lite-cleanup need >=20), and running with NO node_modules proves the suites are dependency-free.
  test-node18:
    name: test-node18 (engines floor -- unit suites only, no install)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # test/SoakAB.test.js teeth anchors `git show 2a08567:Pick.js` (the 1.1.0 kernel)
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - run: npm test

  # The heavy, timing-sensitive gates on one pinned runner. test:perf pins its own semi-space
  # flags in the script; torture needs --expose-gc (also in the script).
  gates:
    name: gates (node 22.23.3 / ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Pinned to EXACT 22.23.3: test:perf:pool keys its per-run byte ceilings (CEIL = measured
          # share + 8 B) by process.version, so the Pool cost gate must run on the version those rows
          # were measured on. This also pins parity / torture / test:perf / test:perf:noinline /
          # bench:verify + the tarball check (all version-robust 0 B/op gates). A patch bump here must
          # re-measure the Pool cost rows (npm run bench:pool) and add a SHARES row, or the gate fails
          # closed. The unit-test matrix (node 20/22/24) is a separate job and is unaffected.
          node-version: 22.23.3
          cache: npm
      - run: npm ci
      # S6: shipped code (Pick/Pool .js/.d.ts) + the soak's invariant oracle must match their committed
      # sha256 pins -- a change to them must re-pin (npm run parity:update) in the same commit.
      - run: npm run parity
      - run: npm run torture
      - run: npm run test:perf
      # 1.1.0 B6: the same gate with V8 inlining OFF -- the worst case, a caller V8 will not inline into. Every
      # lane must still be 0 B/op (research/1.1.0-buffer-apis.md: the From methods + the self-contained PRNG).
      - run: npm run test:perf:noinline
      # Pool.run async cost gate: Pool's own shares (attempt-0 L3-L1, failover L6-L1, by scavenge count)
      # stay <= CEIL (measured share + 8 B, keyed by this exact process.version = v22.23.3); the box and
      # object teeth trip, old-gen is 0, and no Pool outlives its cycle (decisions/0007 Amendment).
      - run: npm run test:perf:pool
      - run: npm run bench:verify
      - name: tarball is exactly the 11 whitelisted files
        run: |
          node -e '
            const cp = require("child_process");
            const out = cp.execSync("npm pack --dry-run --json").toString();
            const files = JSON.parse(out)[0].files.map((f) => f.path).sort();
            const expected = ["CHANGELOG.md","GUIDE.md","LICENSE","Pick.d.ts","Pick.js","Pool.d.ts","Pool.js","README.md","RECIPES.md","llms.txt","package.json"].sort();
            const got = JSON.stringify(files), exp = JSON.stringify(expected);
            if (got !== exp) { console.error("tarball file set mismatch\ngot:      " + got + "\nexpected: " + exp); process.exit(1); }
            console.log("tarball OK: exactly " + files.length + " files");
          '

  # The capstone's headless kernel (pickEcosystem/live, research/capstone-P1-spec.md F8): its own package.json
  # pins the published bricks (lite-pick 1.1.0, lite-worker-pool 1.1.0, the di-* line). `npm test` runs the gates
  # over virtual workers (deterministic); G10 re-runs G1 + G2 against THIS working tree's Pick.js, and the kernel
  # OVERLAY (below) re-runs the whole suite against the repo ROOT Pick.js / Pool.js, so a kernel change cannot
  # silently break the capstone. `npm run smoke` MEASURES this host's saturating throughput with a throwaway
  # probe, then runs at half of it over real worker_threads with every fault once (the probe sweep and the
  # flaky-breaker wait each take up to ~12 s, so the run is well over a minute); `npm run browser-smoke` serves
  # the P3 page and drives it in the runner's Chrome (headless, over the DevTools protocol) against pinned esm.sh.
  capstone:
    name: capstone (pickEcosystem/live, node 22)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pickEcosystem/live
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pickEcosystem/live/package-lock.json
      - run: npm ci
      - run: npm test
      # Kernel overlay (B4): run the SAME capstone suite a second time against the repo ROOT Pick.js/Pool.js
      # (sha256-verified, each overlaid file confirmed to resolve INSIDE the temp tree, info line names the files
      # that differ from pinned 1.1.0), then its must-fail controls (a clean root -> exit 0; a mutant root Pool.js
      # -> non-zero naming G8; a root missing Pool.js -> exit 2; a symlinked lite-pick whose scratch target stays
      # byte-unchanged). Needs only live/node_modules.
      - run: npm run overlay
      - run: npm run overlay:teeth
      # P3 graceful shutdown over REAL worker_threads: clean (code 0) + DEADLINE (code 2), each with a sabotage
      # control; the terminate-counting spawn wrapper proves every thread is retired.
      - run: npm run shutdown:real
      # The run RATE is MEASURED (a throwaway probe finds this host's saturating throughput); the smoke then runs
      # at half that (headroom). A second run at 5x overload proves the admission path sheds (and still loses no
      # request outside a fault window).
      - run: npm run smoke
      - run: npm run smoke
        env:
          SMOKE_OVERLOAD: '5'
      - run: npm run browser-smoke
      # P5: every heartbeat gate and invariant tripped by a planted defect through the real harness (~20 s, virtual
      # workers); the long real-thread heartbeat itself runs in soak-nightly.yml.
      - run: npm run heartbeat:teeth

  # Compile a real consumer against the PACKED tarball (not the working tree) so the exports
  # map and the typesVersions /pool mapping are exercised. ubuntu is deliberate: its filesystem
  # is CASE-SENSITIVE, so `@zakkster/lite-pick/pool` -> Pool.d.ts only resolves via typesVersions
  # (on a case-insensitive FS `pool` would match `Pool.d.ts` and hide a broken mapping).
  types-compat:
    name: types-compat (ubuntu, typescript@5)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: pack the tarball
        run: npm pack
      - name: install the packed tarball into the consumer fixture
        working-directory: test/types/consumer
        run: npm install "$GITHUB_WORKSPACE"/zakkster-lite-pick-*.tgz
      - name: compile consumer under moduleResolution node16
        working-directory: test/types/consumer
        run: npx -y -p typescript@5 tsc -p tsconfig.node16.json
      - name: compile consumer under moduleResolution node10
        working-directory: test/types/consumer
        run: npx -y -p typescript@5 tsc -p tsconfig.node10.json
      - name: compile consumer under moduleResolution bundler
        working-directory: test/types/consumer
        run: npx -y -p typescript@5 tsc -p tsconfig.bundler.json
      - name: compile consumer under lib ES2022 only (no DOM, no @types/node)
        working-directory: test/types/consumer
        run: npx -y -p typescript@5 tsc -p tsconfig.es2022.json

  # Capstone P4: publish the site -- the hub (pickEcosystem/), the live system and the simulated Pool Scope -- to
  # GitHub Pages, only from main and only after EVERY gate above is green (lite-pick's own matrix and Node 18 floor, its allocation
  # gates, the types against the packed tarball, and the capstone, whose browser smoke run already drove this exact
  # site build in headless Chrome). The site is built by pickEcosystem/live/site.mjs: exactly what the pages reach
  # (no node_modules, tests or research), with the root redirecting to the hub. Needs Settings -> Pages ->
  # Source: GitHub Actions.
  deploy:
    name: deploy (GitHub Pages)
    needs: [test, test-node18, gates, capstone, types-compat]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    # Only the deploy serializes; the gates never cancel each other.
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}pickEcosystem/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: build the site
        run: node pickEcosystem/live/site.mjs _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
